[package]
name = "outside-portal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "the portal's broadcaster: RuneLite's window, its sound and the chat, to the relay"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_Xps", "Win32_System_Console", "Win32_System_Time",
  "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_SystemInformation",
] }
wasapi = "0.26"
opus = "0.4"
jpeg-encoder = { version = "0.7", features = ["simd"] }
fast_image_resize = "6"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tiny_http = "0.12"
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
