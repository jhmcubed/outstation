name: tests
# (11/07/2026, his Actions minutes nearly spent for the month: not on every push to a working branch, where a session
# runs the same checks itself; on a pull request, on main, and by hand. A public repository's runs cost nothing.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: the Worker's packages
        working-directory: relay
        run: npm ci
      - name: the Worker's types
        working-directory: relay
        run: npx tsc --noEmit
      - name: the Worker's own tests (the almanac, the open list, the year, the lookups, the keep, the Array)
        working-directory: relay
        run: npm test
      # (the Python relay it was also run against was retired 11/17/2026: the Worker's the only relay)
      - name: the protocol, against the Worker (wrangler dev)
        run: python tests/protocol_test.py

  # The Outside plugin (11/16/2026, the 11/10 review: on the Plugin Hub now, so a change that breaks it is caught here,
  # not only when a session runs its tests). The whole plugin's unit tests and the Hub's rules, then the Hub's version
  # cut from it (hub_cut.py, into a scratch folder: never compared with outside-plugin, which takes a change only after
  # it's merged here) with its own tests and the Hub's rules. Java 21 and Gradle 8.14.3, as the session that set it up
  # ran them; build.gradle compiles for Java 11, as the Hub does.
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: the whole plugin's unit tests
        working-directory: plugin
        run: gradle test --console=plain
      - name: the whole plugin against the Hub's rules
        run: python plugin/hub_check.py
      - name: the plugin's closed lists against the relay's (bosses, raids, minigames, landing sites)
        run: python tests/lists_match.py
      - name: the Hub's version, cut
        run: python plugin/hub_cut.py "$RUNNER_TEMP/outside-plugin"
      - name: the Hub's version's unit tests
        working-directory: ${{ runner.temp }}/outside-plugin
        run: gradle test --console=plain
      - name: the Hub's version against the Hub's rules
        run: python "$RUNNER_TEMP/outside-plugin/hub_check.py"
      # (11/19/2026: update 4 compiled and passed every test and still wouldn't switch on in RuneLite: a listener
      # misnamed for RuneLite's event bus. Only starting it inside RuneLite shows that)
      - name: the Hub's version starts inside RuneLite
        run: |
          command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
          python plugin/start_check.py "$RUNNER_TEMP/outside-plugin"

  client:
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rust (MSVC)
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
      - name: ninja
        run: choco install ninja --no-progress -y
      - name: build
        run: cargo build --release --locked
      - name: unit tests
        run: cargo test --release --locked
      - name: the safety check
        run: python tests/safety_check.py --needs-icon target/release/outstation.exe
      # the Outside page's copy of a clip through Windows' own encoder (clip.rs, page_copy), and what it weighs: a
      # report, not a check (a runner without Media Foundation's H.264 encoder can't make one)
      - name: the page's copy of a clip (report)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/outstation.exe -ArgumentList "--page-selftest", "$env:RUNNER_TEMP\page" -NoNewWindow -Wait -PassThru -RedirectStandardOutput page.txt -RedirectStandardError page-err.txt
          Get-Content page.txt, page-err.txt
          exit $p.ExitCode
