name: Something went wrong
description: The outstation crashed, wouldn't transmit, or did something odd.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for saying. In the outstation, open the settings, then **more**, and press **copy the station log**: it puts the outstation's log on the clipboard with your keys, codes and webhook addresses taken out. Paste it in the last box.
  - type: input
    id: version
    attributes:
      label: The outstation's version
      description: The log's first line says it (for example, outstation 0.1.0).
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: Windows 11
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what it did instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Its log
      description: "copy the station log", pasted here.
      render: text
