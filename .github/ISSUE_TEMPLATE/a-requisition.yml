name: A requisition
description: Something you'd like the outstation to do (a feature request).
labels: ["requisition"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking. Say what you'd like it to do, and what it would help with.
  - type: input
    id: version
    attributes:
      label: The outstation's version
      description: Filled in when the outstation opens this form; otherwise the station log's first line says it (for example, outstation 0.1.0).
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What it should do, and when you'd use it.
    validations:
      required: true
